{{- if .Values.gateway.enabled }}
{{- if not .Values.gateway.name }}
{{- fail "gateway.name is required when gateway.enabled is true" }}
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "kattungar-notify.fullname" . }}
  labels:
    {{- include "kattungar-notify.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name | quote }}
      {{- with .Values.gateway.namespace }}
      namespace: {{ . | quote }}
      {{- end }}
      {{- with .Values.gateway.listenerName }}
      sectionName: {{ . | quote }}
      {{- end }}
  {{- with .Values.gateway.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "kattungar-notify.fullname" . }}
          port: 80
{{- end }}
