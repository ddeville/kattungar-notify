{{- $secretName := include "kattungar-notify.secretName" . -}}
{{- $secret := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- if not $secret -}}
{{- fail (printf "required Secret %q was not found in namespace %q" $secretName .Release.Namespace) -}}
{{- else -}}
{{- $requiredKeys := list "server-api-keys.json" "apns-key-id" "apns-key.p8" "google-client-credentials.json" "google-refresh-token" "google-calendar-id" -}}
{{- $secretData := default dict $secret.data -}}
{{- range $requiredKeys -}}
{{- if not (hasKey $secretData .) -}}
{{- fail (printf "required Secret %q in namespace %q is missing key %q" $secretName $.Release.Namespace .) -}}
{{- end -}}
{{- end -}}
{{- end -}}
